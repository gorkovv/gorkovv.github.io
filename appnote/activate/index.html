<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appnote Activation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0;
      background: #f5f5f5; color: #333; text-align: center; padding: 20px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p  { color: #666; margin-bottom: 24px; }
    .btn {
      display: inline-block; padding: 12px 28px; border-radius: 10px;
      background: #007AFF; color: #fff; text-decoration: none;
      font-size: 1rem; font-weight: 600; margin: 8px;
    }
    .btn.secondary { background: #555; }
    #status { margin-top: 20px; font-size: 0.9rem; color: #999; }
  </style>
</head>
<body>
  <h1>Appnote Pro Activation</h1>
  <p>If the app is installed, it will open automatically.<br>
     Otherwise, download it using the links below.</p>

  <a class="btn" href="https://apps.apple.com/app/appnote/id6471715403">App Store</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.govv.appnote">Google Play</a>
  <a class="btn secondary" href="https://apps.rustore.ru/app/com.govv.appnote">RuStore</a>

  <div id="status">Trying to open the app…</div>

  <script>
    // Если App Links/Universal Links не сработали (приложение не установлено),
    // пробуем custom scheme как запасной вариант
    const params = window.location.search;
    setTimeout(function () {
      const fallback = 'appnote://activate' + params;
      window.location.href = fallback;
    }, 1500);

    setTimeout(function () {
      document.getElementById('status').textContent =
        'Please install the app and open this link again.';
    }, 3000);
  </script>
</body>
</html>
